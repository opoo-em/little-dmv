name: refresh events

on:
  schedule:
    # Sunday 12:00 UTC = 8am ET (7am ET in DST). Em plans weekends Sunday morning.
    - cron: "0 12 * * 0"
  workflow_dispatch: {}  # manual trigger from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-events
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Run pipeline
        env:
          HOME_LAT: ${{ secrets.HOME_LAT }}
          HOME_LNG: ${{ secrets.HOME_LNG }}
        run: python -m scripts.main --keep-dummy

      - name: Commit updated events.json
        run: |
          git config user.name  "little-dmv-bot"
          git config user.email "little-dmv-bot@users.noreply.github.com"
          if git diff --quiet -- data/events.json; then
            echo "No changes to events.json."
            exit 0
          fi
          git add data/events.json
          git commit -m "refresh: events.json ($(date -u +%Y-%m-%d))"
          git push
