# Source registry for Little DMV pipeline.
#
# Shape:
#   ical:
#     - id: short-slug             # unique across all sources
#       name: Human Readable
#       url: https://.../events.ics
#       venue_default: "Fallback venue name"
#       place_default: indoor|outdoor
#       distance_venue_key: <key in scripts/distance.py VENUE_COORDS>
#       source: pipeline id written into each event (defaults to `id`)
#
#   scrape:
#     - id: short-slug
#       module: scripts.scrapers.<name>   # importable Python module
#       # module exposes: ID, NAME, URL, fetch() -> list[dict]

# =============================================================================
# iCal feeds (verified endpoints)
# =============================================================================
ical:
  # MCPL — LibNet feeds API. Config is a base64-encoded JSON blob URL param.
  # Ours filters ages=[Toddler, Baby], all locations, days=30 (our lookahead
  # is 21, +buffer). The feed emits BEGIN:VCALENDAR text/calendar. Feed itself
  # already applies the age filter, so age_passes is redundant but harmless.
  - id: mcpl-kids
    name: MCPL — Toddler & Baby programming
    url: https://mcpl.libnet.info/feeds?data=eyJmZWVkVHlwZSI6ImljYWwiLCJmaWx0ZXJzIjp7ImxvY2F0aW9uIjpbImFsbCJdLCJhZ2VzIjpbIlRvZGRsZXIiLCJCYWJ5Il0sInR5cGVzIjpbImFsbCJdLCJ0YWdzIjpbXSwidGVybSI6IiIsImRheXMiOjMwfX0=
    venue_default: "MCPL branch"
    place_default: indoor
    source: mcpl
    state: MD
    source_url: https://mcpl.libnet.info/

  # Smithsonian — Trumba calendar system. No age filter available at feed
  # level, so require_kid_signal below prunes adult programming.
  - id: smithsonian-events
    name: Smithsonian — Events
    url: https://www.trumba.com/calendars/smithsonian-events.ics
    venue_default: "Smithsonian"
    place_default: indoor
    # NOTE: intentionally no distance_venue_key here. The Smithsonian iCal
    # covers dozens of physical museums plus nationwide affiliates; using a
    # single fallback (the National Mall) made every out-of-DMV event look
    # like it was in DC. Let normalize.infer_venue_key work off the actual
    # venue string, and let looks_out_of_dmv drop anything else.
    source: smithsonian
    state: DC
    require_kid_signal: true
    require_dmv_location: true
    source_url: https://www.si.edu/events

# =============================================================================
# HTML scrapers (enabled — Schema.org JSON-LD extraction)
# =============================================================================
scrape:
  - id: butlers-orchard
    module: scripts.scrapers.butlers
    state: MD

  - id: glen-echo-park
    module: scripts.scrapers.glen_echo
    state: MD

  - id: national-building-museum
    module: scripts.scrapers.nbm
    state: DC

  - id: national-childrens-museum
    module: scripts.scrapers.national_childrens_museum
    state: DC

  - id: national-zoo
    module: scripts.scrapers.national_zoo
    state: DC

  - id: pike-and-rose
    module: scripts.scrapers.pike_and_rose
    state: MD

  - id: bethesda-row
    module: scripts.scrapers.bethesda_row
    state: MD

  # Firehose muni calendar — dumps commission meetings, adult concerts,
  # naloxone training, etc. Require a positive kid signal to keep an event.
  - id: rockville-city
    module: scripts.scrapers.rockville
    state: MD
    require_kid_signal: true
    source_url: https://www.rockvillemd.gov/calendar.aspx

  # MCPL HTML fallback retired 2026-09-08 — canonical iCal at libnet.info
  # is wired above.

  # Kennedy Center Millennium Stage retired 2026-09-08 — Felix is still too
  # young for the mostly-adult programming; revisit when he's ~3+.

  # Montgomery Parks HTML fallback — kept for now; iCal endpoint not found
  # on their WordPress install. Currently returns 0 events (JSON-LD not on
  # the list page); replacement scraper being written per docs/sources.md.
  - id: montgomery-parks
    module: scripts.scrapers.montgomery_parks
    state: MD

  # Aggregator — put LAST so canonical sources win in dedupe.
  - id: kidfriendly-dc
    module: scripts.scrapers.kidfriendly_dc
    state: DC
